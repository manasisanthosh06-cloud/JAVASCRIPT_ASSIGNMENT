<!DOCTYPE html>
<html>
<head>
    <title>Character Counter</title>
    <script src="script.js"></script>

    <style>
        body{
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        textarea{
            width: 400px;
            height: 150px;
            font-size: 16px;
            padding: 10px;
        }

        #count{
            margin-top: 10px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h2>Character Counter</h2>

    <textarea id="message"
              oninput="countCharacters()"
              placeholder="Type here..."></textarea>

    <div id="count">
        Character Count: 0
    </div>

</body>
</html>
